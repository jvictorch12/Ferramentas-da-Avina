<!-- Versão 3.0 do Sistema - 05/09/26 - 15h40min -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orion Fine Jewelry - Coleção Terra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-primary: #523f31;   /* Marrom escuro */
      --color-secondary: #856f56; /* Marrom médio */
      --color-accent: #b79f7b;    /* Bege dourado */
      --color-light: #c6bdae;     /* Off-white / areia */
      --color-bg: #ece7e1;
      --card-bg: #ffffff;
      --text-dark: #2c221a;
      --text-light: #fdfbf7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--color-bg);
      color: var(--text-dark);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(180deg, var(--color-light) 0%, var(--color-bg) 100%);
      text-align: center;
      padding: 45px 20px 25px;
      border-bottom: 1px solid var(--color-accent);
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--color-primary);
      margin-bottom: 6px;
    }

    header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: var(--color-secondary);
      margin-bottom: 10px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--color-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--color-light);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(82, 63, 49, 0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(82, 63, 49, 0.15);
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: 250px;
      overflow: hidden;
      background-color: var(--color-light);
      cursor: zoom-in;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .image-wrapper:hover img {
      transform: scale(1.06);
    }

    .zoom-hint {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(82, 63, 49, 0.75);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-content h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: var(--color-primary);
      margin-bottom: 6px;
    }

    .price {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-secondary);
      margin-bottom: 8px;
    }

    .card-content p {
      font-size: 0.82rem;
      color: #665b52;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-details {
      background-color: var(--color-secondary);
      color: var(--text-light);
    }

    .btn-details:hover {
      background-color: var(--color-primary);
    }

    .btn-cart {
      background-color: var(--color-accent);
      color: var(--color-primary);
    }

    .btn-cart:hover {
      background-color: #a48c69;
      color: #fff;
    }

    footer {
      background-color: var(--color-primary);
      color: var(--color-light);
      text-align: center;
      padding: 24px 20px;
      font-size: 0.85rem;
      margin-top: 60px;
    }

    /* Modal de Zoom */
    .lightbox-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(44, 34, 26, 0.88);
      backdrop-filter: blur(5px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    .lightbox-modal img {
      max-width: 90%;
      max-height: 85%;
      border-radius: 6px;
      border: 2px solid var(--color-accent);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Modal de Detalhes */
    .details-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(44, 34, 26, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background-color: #fff;
      border: 1px solid var(--color-accent);
      border-radius: 8px;
      max-width: 440px;
      width: 100%;
      padding: 28px;
      position: relative;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--color-primary);
    }

    .modal-box h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: var(--color-primary);
      margin-bottom: 16px;
    }

    .spec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .spec-table td {
      padding: 8px 4px;
      border-bottom: 1px solid var(--color-bg);
    }

    .spec-table td:first-child {
      font-weight: 600;
      color: var(--color-secondary);
      width: 40%;
    }
  </style>
</head>
<body>

  <header>
    <h1>ORION FINE JEWELRY</h1>
    <h2>Coleção Terra & Quartzo</h2>
    <p>Peças orgânicas desenvolvidas a partir de gemas naturais fumê, madrepérolas e metais selecionados em harmonia terrosa.</p>
  </header>

  <main class="container">
    <div class="catalog-grid" id="catalog-grid"></div>
  </main>

  <footer>
    <p>&copy; 2026 Orion Fine Jewelry &bull; Contato: contato@orionjewelry.com</p>
  </footer>

  <div id="lightbox" class="lightbox-modal" onclick="closeZoom()">
    <img id="lightbox-img" src="" alt="Zoom da Peça">
  </div>

  <div id="detailsModal" class="details-modal" onclick="closeDetailsOut(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="closeDetails()">&times;</button>
      <h4 id="modal-title">Detalhes da Peça</h4>
      <table class="spec-table" id="modal-table"></table>
    </div>
  </div>

  <script>
    const products = [
      {
        id: 1,
        title: "Colar Quartzo Fumê Bruto",
        price: "R$ 480,00",
        desc: "Pingente esculpido em quartzo fumê translúcido com acabamento lapidado rústico e corrente em cordão acetinado.",
        img: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Metal / Suporte": "Prata 925 com Banho Envelhecido",
          "Pedra Central": "Quartzo Fumê Natural",
          "Comprimento": "45 cm + 5 cm extensor",
          "Origem": "Minas Gerais, Brasil"
        }
      },
      {
        id: 2,
        title: "Brincos Âmbar Báltico & Ouro",
        price: "R$ 320,00",
        desc: "Esferas orgânicas de resina fóssil de âmbar escuro com inclusões douradas e pinos antialérgicos.",
        img: "https://images.unsplash.com/photo-1630019852942-f89202989a59?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Material": "Âmbar Natural e Folheado a Ouro 18k",
          "Diâmetro": "12 mm",
          "Tarraxa": "Borboleta reforçada",
          "Acabamento": "Polimento manual"
        }
      },
      {
        id: 3,
        title: "Pulseira Pérola Ouro Velho",
        price: "R$ 360,00",
        desc: "Pérolas barrocas com iridescência champanhe intercaladas com esferas acetinadas e fecho magnético.",
        img: "https://images.unsplash.com/photo-1611591475879-1c9f4d221295?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Gemas": "Pérolas Cultivadas de Água Doce",
          "Fecho": "Imã neodímio banhado a ouro velho",
          "Comprimento": "18 cm",
          "Estilo": "Contemporâneo Clássico"
        }
      },
      {
        id: 4,
        title: "Colar Escultural Concha & Madeira",
        price: "R$ 410,00",
        desc: "Peça autoral confeccionada em madeira imbuia torneada, entremeios terrosos e concha fóssil polida.",
        img: "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Elementos": "Concha Marinha e Madeira Nobre",
          "Cordão": "Fio de algodão encerado",
          "Comprimento": "50 cm",
          "Peso": "42g"
        }
      },
      {
        id: 5,
        title: "Bracelete Duplo em Couro & Pingente",
        price: "R$ 290,00",
        desc: "Tiras de couro cru marrom café com passador em banho ouro bronze e medalha de resina âmbar.",
        img: "https://images.unsplash.com/photo-1602751584552-8ba73aad10e1?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Material": "Couro Legítimo Tratado",
          "Metais": "Zamac com banho cobre fosco",
          "Tamanho": "Ajustável para pulsos de 16 a 20 cm",
          "Destaque": "Resistente à oxidação"
        }
      },
      {
        id: 6,
        title: "Choker Minimalista Couro Bege",
        price: "R$ 220,00",
        desc: "Gargantilha rente ao pescoço em couro aveludado areia, detalhes em metal dourado e pérola central.",
        img: "https://images.unsplash.com/photo-1598560917505-59a3ad559071?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Estrutura": "Couro sintético vegetal",
          "Detalhes": "Pérola barroca e ponteiras em latão",
          "Espessura": "6 mm",
          "Fecho": "Extensor mosquetão"
        }
      },
      {
        id: 7,
        title: "Anel Solitário Quartzo Rústico",
        price: "R$ 380,00",
        desc: "Aro robusto em prata acetinada com cravação em garra segurando cristal bruto de quartzo escuro.",
        img: "https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Aro": "Prata de Lei 925",
          "Pedra": "Cristal Fumê não facetado",
          "Tamanho": "Aro 17 (ajustável sob consulta)",
          "Formato": "Orgânico assimétrico"
        }
      },
      {
        id: 8,
        title: "Anel Vintage Cabochão Chocolate",
        price: "R$ 340,00",
        desc: "Base larga esculpida em tom champanhe dourado com gema de vidro soprado italiano em formato cabochão.",
        img: "https://images.unsplash.com/photo-1603561591411-07134e71a2a9?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Metal": "Bronze com verniz antialérgico",
          "Gema": "Cabochão Murano translúcido",
          "Largura do Aro": "14 mm no ponto central",
          "Estilo": "Art Nouveau"
        }
      },
      {
        id: 9,
        title: "Anel Madeira Polida & Metal Nude",
        price: "R$ 260,00",
        desc: "Design contemporâneo mesclando madeira jacarandá macia com estrutura escovada em tom areia.",
        img: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Composição": "Madeira de demolição & Titânio acetinado",
          "Conforto": "Interior anatômico confort-fit",
          "Tamanhos": "Disponível do 15 ao 22",
          "Resistência": "Tratamento à prova d'água"
        }
      },
      {
        id: 10,
        title: "Brincos Pendentes Quartzo e Linho",
        price: "R$ 275,00",
        desc: "Pendentes longos e elegantes em formato de gota fosca com franjas sutis em fibra natural de linho.",
        img: "https://images.unsplash.com/photo-1535632787350-4e68ef0ac584?auto=format&fit=crop&w=700&q=80",
        specs: {
          "Base": "Prata banhada em ouro rosé queimado",
          "Pendentes": "Gotas de quartzo café",
          "Comprimento": "7,5 cm",
          "Peso": "6g o par (ultraleve)"
        }
      }
    ];

    const catalogGrid = document.getElementById('catalog-grid');

    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="image-wrapper" onclick="openZoom('${p.img}')" title="Clique para ampliar">
          <img src="${p.img}" alt="${p.title}" loading="lazy">
          <span class="zoom-hint">&#128269; Zoom</span>
        </div>
        <div class="card-content">
          <h3>${p.title}</h3>
          <div class="price">${p.price}</div>
          <p>${p.desc}</p>
          <div class="btn-group">
            <button class="btn btn-details" onclick="openDetails(${p.id})">Ver Características</button>
            <button class="btn btn-cart" onclick="alert('Item adicionado à sua sacola!')">Adicionar à Sacola</button>
          </div>
        </div>
      `;
      catalogGrid.appendChild(card);
    });

    // Zoom Functions
    function openZoom(src) {
      const modal = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      modal.style.display = 'flex';
    }

    function closeZoom() {
      document.getElementById('lightbox').style.display = 'none';
    }

    // Details Modal Functions
    function openDetails(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;

      document.getElementById('modal-title').textContent = p.title;
      const table = document.getElementById('modal-table');
      table.innerHTML = '';

      for (const [key, value] of Object.entries(p.specs)) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${key}</td><td>${value}</td>`;
        table.appendChild(tr);
      }

      document.getElementById('detailsModal').style.display = 'flex';
    }

    function closeDetails() {
      document.getElementById('detailsModal').style.display = 'none';
    }

    function closeDetailsOut(e) {
      if (e.target.id === 'detailsModal') {
        closeDetails();
      }
    }

    // Tecla ESC para fechar janelas abertas
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeZoom();
        closeDetails();
      }
    });
  </script>
</body>
</html>
