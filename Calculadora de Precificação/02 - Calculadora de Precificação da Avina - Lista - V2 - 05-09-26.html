<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1FH7yT_QPjzx5d6LmSXo_wPwiuUbJeqoc">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1FH7yT_QPjzx5d6LmSXo_wPwiuUbJeqoc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Avina">
    <title>Calculadora Multi-Produtos - Avina</title>
    <style>
        @font-face {
            font-family: 'Safira March Personal';
            src: local('Safira March Personal'),
                 local('SafiraMarchPersonal'),
                 local('Safira March'),
                 url('SafiraMarchPersonal.otf') format('opentype'),
                 url('SafiraMarchPersonal.ttf') format('truetype'),
                 url('safira-march.otf') format('opentype'),
                 url('safira-march.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --avina-dark: #523f31;
            --avina-medium: #856f56;
            --avina-accent: #b79f7b;
            --avina-light: #c6bdae;
            --avina-bg: #f5f3f0;
            --avina-white: #ffffff;
            
            --teste-red: #8b0000;
            --teste-green: #006400;

            --fonte-principal: 'Safira March Personal', 'Georgia', serif;
            --fonte-numeros: 'Georgia', 'Segoe UI', serif;
        }

        body {
            font-family: var(--fonte-principal);
            background-color: var(--avina-bg);
            color: var(--avina-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 12px 50px 12px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            width: 100%;
        }

        .container {
            background-color: var(--avina-white);
            padding: 30px 22px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(82, 63, 49, 0.15); 
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header-container {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo-img {
            max-width: 135px; 
            max-height: 110px;
            width: auto;
            height: auto;
            margin: 0 auto 12px auto;
            display: block;
            object-fit: contain;
        }

        h1 {
            font-family: var(--fonte-principal);
            font-size: 1.15em;
            color: var(--avina-dark);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .section-title {
            font-family: var(--fonte-principal);
            font-weight: 800;
            font-size: 1.2em;
            margin-top: 24px;
            margin-bottom: 14px;
            border-bottom: 3px solid var(--avina-accent);
            padding-bottom: 4px;
            color: var(--avina-dark);
            letter-spacing: 0.5px;
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .form-group label {
            flex: 1;
            font-family: var(--fonte-principal);
            font-size: 1.05em;
            font-weight: 600;
            color: var(--avina-medium); 
        }

        .input-wrapper {
            flex: 0.68;
            display: flex;
            align-items: center;
            border: 1px solid var(--avina-light);
            border-radius: 6px;
            background-color: var(--avina-white);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--avina-medium);
            box-shadow: 0 0 0 3px rgba(133, 111, 86, 0.2);
        }

        .input-wrapper input, .input-wrapper select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            flex: 1;
            border: none;
            padding: 9px 8px;
            text-align: right;
            font-family: var(--fonte-numeros);
            font-variant-numeric: lining-nums tabular-nums;
            font-size: 1.05em;
            font-weight: 700;
            color: var(--teste-red); 
            outline: none;
            width: 100%;
            background: transparent;
        }

        .input-wrapper select {
            text-align-last: right;
            direction: rtl;
        }

        .prefix, .suffix {
            background-color: var(--avina-bg);
            color: var(--avina-dark); 
            padding: 9px 10px;
            font-family: var(--fonte-numeros);
            font-weight: 700;
            user-select: none;
        }

        .prefix { border-right: 1px solid var(--avina-light); }
        .suffix { border-left: 1px solid var(--avina-light); }

        .results {
            background-color: var(--avina-light); 
            padding: 20px 18px;
            border-radius: 8px;
            margin-top: 25px;
            border: 2px solid var(--avina-accent);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1.1em;
            align-items: center;
        }

        .result-item:last-child { margin-bottom: 0; }

        .result-item span {
            font-family: var(--fonte-principal);
            color: var(--avina-dark); 
            font-weight: 600;
        }

        .result-item strong {
            font-family: var(--fonte-numeros);
            font-variant-numeric: lining-nums tabular-nums;
            color: var(--avina-dark); 
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .destaque {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed var(--avina-dark);
        }

        .destaque strong {
            font-size: 1.2em;
            background-color: rgba(0, 100, 0, 0.1); 
            color: var(--teste-green); 
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* Botão de Adicionar à Tabela */
        .btn-salvar-produto {
            background-color: var(--teste-green);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-family: var(--fonte-principal);
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(0, 100, 0, 0.2);
            transition: background 0.2s;
        }
        .btn-salvar-produto:hover {
            background-color: #004d00;
        }

        /* Seção da Tabela Resumo */
        .resumo-section {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 3px solid var(--avina-accent);
            width: 100%;
        }

        .resumo-title {
            font-size: 1.1em;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 15px;
            color: var(--avina-dark);
        }

        .tabela-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
            background: var(--avina-white);
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--avina-light);
        }

        th {
            background-color: var(--avina-dark);
            color: var(--avina-white);
            font-size: 0.85em;
            text-transform: uppercase;
        }

        td {
            font-family: var(--fonte-numeros);
            color: var(--avina-dark);
        }

        td:first-child {
            font-family: var(--fonte-principal);
            font-weight: bold;
        }

        .btn-excluir {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            color: var(--teste-red);
        }

        @media (max-width: 480px) {
            .container { padding: 22px 14px; }
            .input-wrapper input { font-size: 16px; }
            th, td { padding: 8px 5px; font-size: 0.8em; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-container">
        <img src="https://lh3.googleusercontent.com/d/1ypjQtK_hqimcc6mrn6c4azp1_4O_kOFJ" alt="Logo Avina" class="logo-img">
        <h1>Calculadora de Precificação</h1>
    </div>

    <!-- Identificação do Produto -->
    <div class="form-group" style="background: var(--avina-light); padding: 10px; border-radius: 8px;">
        <label for="nome-produto" style="color: var(--avina-dark);">Nome do Produto:</label>
        <div class="input-wrapper" style="flex: 0.75;">
            <input type="text" id="nome-produto" value="Produto 1" style="text-align: left; color: var(--avina-dark);" placeholder="Ex: Bolsa Couro">
        </div>
    </div>

    <div class="section-title">CUSTOS</div>
    
    <div class="form-group">
        <label for="peca">Peça:</label>
        <div class="input-wrapper">
            <span class="prefix">R$</span>
            <input type="text" inputmode="decimal" id="peca" value="0,00" onfocus="this.select()" oninput="calcular()" onblur="formatarCampo(this)" onkeydown="tratarEnter(event, this)">
        </div>
    </div>
    
    <div class="form-group">
        <label for="embalagem">Embalagem:</label>
        <div class="input-wrapper">
            <span class="prefix">R$</span>
            <input type="text" inputmode="decimal" id="embalagem" value="0,00" onfocus="this.select()" oninput="calcular()" onblur="formatarCampo(this)" onkeydown="tratarEnter(event, this)">
        </div>
    </div>
    
    <div class="form-group">
        <label for="frete">Frete:</label>
        <div class="input-wrapper">
            <span class="prefix">R$</span>
            <input type="text" inputmode="decimal" id="frete" value="0,00" onfocus="this.select()" oninput="calcular()" onblur="formatarCampo(this)" onkeydown="tratarEnter(event, this)">
        </div>
    </div>

    <div class="section-title">TAXAS</div>
    
    <div class="form-group">
        <label for="maquininha">Maquininha:</label>
        <div class="input-wrapper">
            <input type="text" inputmode="decimal" id="maquininha" value="0,00" onfocus="this.select()" oninput="calcular()" onblur="formatarCampo(this)" onkeydown="tratarEnter(event, this)">
            <span class="suffix">%</span>
        </div>
    </div>
    
    <div class="form-group">
        <label for="lucro-desejado">Lucro Desejado:</label>
        <div class="input-wrapper">
            <input type="text" inputmode="decimal" id="lucro-desejado" style="color: var(--teste-green);" value="0,00" onfocus="this.select()" oninput="calcular()" onblur="formatarCampo(this)" onkeydown="tratarEnter(event, this)">
            <span class="suffix">%</span>
        </div>
    </div>

    <div class="results">
        <div class="section-title" style="margin-top:0;">VALORES FINAIS</div>
        <div class="result-item">
            <span>Valor de Venda:</span>
            <strong id="valor-venda">R$ 0,00</strong>
        </div>
        <div class="result-item destaque">
            <span>Valor Recebido:</span>
            <strong id="valor-recebido">R$ 0,00</strong>
        </div>
        <div class="result-item destaque" style="border-top: none; margin-top: 8px; padding-top: 0;">
            <span>Lucro:</span>
            <strong id="lucro-rs">R$ 0,00</strong>
        </div>
        <div class="result-item destaque" style="border-top: none; margin-top: 8px; padding-top: 0;">
            <span>Lucro Percentual:</span>
            <strong id="lucro-percentual">0,00%</strong>
        </div>
    </div>

    <!-- Botão para adicionar à tabela abaixo -->
    <button class="btn-salvar-produto" onclick="adicionarAolista()">+ Salvar Produto na Tabela</button>

    <!-- Tabela Resumo Final -->
    <div class="resumo-section">
        <div class="resumo-title">Resumo dos Produtos Cadastrados</div>
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Venda</th>
                        <th>Lucro (R$)</th>
                        <th>Lucro (%)</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    <tr id="linha-vazia">
                        <td colspan="5" style="text-align: center; color: var(--avina-medium);">Nenhum produto adicionado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    let listaProdutos = [];

    function parseInput(val) {
        if (!val) return 0;
        let limpo = String(val).trim();
        if (limpo.includes(',') && limpo.includes('.')) {
            limpo = limpo.replace(/\./g, '').replace(',', '.');
        } else {
            limpo = limpo.replace(',', '.');
        }
        const num = parseFloat(limpo);
        return isNaN(num) ? 0 : num;
    }

    function formatarCampo(input) {
        const num = parseInput(input.value);
        input.value = num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        calcular();
    }

    function tratarEnter(event, input) {
        if (event.key === 'Enter') {
            event.preventDefault();
            formatarCampo(input);
            const inputs = Array.from(document.querySelectorAll('.input-wrapper input'));
            const index = inputs.indexOf(input);
            if (index > -1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
                inputs[index + 1].select();
            } else {
                input.blur();
            }
        }
    }

    function calcular() {
        const peca = parseInput(document.getElementById('peca').value);
        const embalagem = parseInput(document.getElementById('embalagem').value);
        const frete = parseInput(document.getElementById('frete').value);
        
        const maquininha = parseInput(document.getElementById('maquininha').value) / 100;
        const lucroDesejado = parseInput(document.getElementById('lucro-desejado').value) / 100;

        const somaCustos = peca + embalagem + frete;

        let valorVenda = 0;
        const divisor = 1 - maquininha - lucroDesejado;
        
        if (divisor > 0) {
            valorVenda = somaCustos / divisor;
        }

        const valorRecebido = valorVenda * (1 - maquininha);
        const lucroRs = valorRecebido - somaCustos;
        
        let lucroPercentual = 0;
        if (valorVenda > 0) {
            lucroPercentual = lucroRs / valorVenda;
        }

        const formatadorMoeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
        const formatadorPorcento = new Intl.NumberFormat('pt-BR', { style: 'percent', minimumFractionDigits: 2 });

        if (divisor <= 0 && somaCustos > 0) {
            document.getElementById('valor-venda').innerText = "Erro";
            document.getElementById('valor-recebido').innerText = "-";
            document.getElementById('lucro-rs').innerText = "-";
            document.getElementById('lucro-percentual').innerText = "-";
        } else {
            document.getElementById('valor-venda').innerText = formatadorMoeda.format(valorVenda);
            document.getElementById('valor-recebido').innerText = formatadorMoeda.format(valorRecebido);
            document.getElementById('lucro-rs').innerText = formatadorMoeda.format(lucroRs);
            document.getElementById('lucro-percentual').innerText = formatadorPorcento.format(lucroPercentual);
        }

        return { valorVenda, lucroRs, lucroPercentual, divisor, somaCustos };
    }

    function adicionarAolista() {
        const nome = document.getElementById('nome-produto').value.trim() || "Produto sem nome";
        const res = calcular();

        if (res.divisor <= 0 && res.somaCustos > 0) {
            alert("Erro: A soma das taxas e do lucro desejado atinge ou ultrapassa 100%. Ajuste os valores.");
            return;
        }

        const formatadorMoeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
        const formatadorPorcento = new Intl.NumberFormat('pt-BR', { style: 'percent', minimumFractionDigits: 2 });

        listaProdutos.push({
            nome: nome,
            venda: formatadorMoeda.format(res.valorVenda),
            lucroRs: formatadorMoeda.format(res.lucroRs),
            lucroPercentual: formatadorPorcento.format(res.lucroPercentual)
        });

        atualizarTabela();
        
        // Incrementa o nome para o próximo produto automaticamente (ex: Produto 2)
        const match = nome.match(/(\d+)$/);
        let proximoNome = "Novo Produto";
        if (match) {
            let num = parseInt(match[1]) + 1;
            proximoNome = nome.replace(/\d+$/, num);
        } else {
            proximoNome = "Produto 2";
        }
        document.getElementById('nome-produto').value = proximoNome;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function atualizarTabela() {
        const corpo = document.getElementById('corpo-tabela');
        corpo.innerHTML = '';

        if (listaProdutos.length === 0) {
            corpo.innerHTML = `<tr id="linha-vazia"><td colspan="5" style="text-align: center; color: var(--avina-medium);">Nenhum produto adicionado ainda.</td></tr>`;
            return;
        }

        listaProdutos.forEach((prod, index) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${prod.nome}</td>
                <td>${prod.venda}</td>
                <td>${prod.lucroRs}</td>
                <td>${prod.lucroPercentual}</td>
                <td style="text-align: center;"><button class="btn-excluir" onclick="removerItem(${index})" title="Excluir">🗑️</button></td>
            `;
            corpo.appendChild(tr);
        });
    }

    function removerItem(index) {
        listaProdutos.splice(index, 1);
        atualizarTabela();
    }

    window.addEventListener('load', calcular);
</script>

</body>
</html>
